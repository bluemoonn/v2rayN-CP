name: release all platforms

on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: false
        type: string

permissions: 
  actions: write
  contents: write

jobs:
  create-release:
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Create release on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          # Pre-create the release so its tag points at this branch's commit,
          # not at the default branch (upload-release-action would use master).
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --notes "Built from ${GITHUB_REF_NAME}@${GITHUB_SHA}" --prerelease
          fi

  public-key:
    if: inputs.release_tag != ''
    needs: create-release
    uses: ./.github/workflows/pub-key.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  update:
    needs: create-release
    runs-on: ubuntu-latest
    steps:

      - name: Trigger build windows
        if: inputs.release_tag != ''
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-windows.yml/dispatches \
            -d "{
              \"ref\": \"${{ github.ref_name }}\",
              \"inputs\": {
                \"release_tag\": \"${{ inputs.release_tag }}\"
              }
            }"

      - name: Trigger build linux
        if: inputs.release_tag != ''
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-linux.yml/dispatches \
            -d "{
              \"ref\": \"${{ github.ref_name }}\",
              \"inputs\": {
                \"release_tag\": \"${{ inputs.release_tag }}\"
              }
            }"

      - name: Trigger build osx
        if: inputs.release_tag != ''
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-osx.yml/dispatches \
            -d "{
              \"ref\": \"${{ github.ref_name }}\",
              \"inputs\": {
                \"release_tag\": \"${{ inputs.release_tag }}\"
              }
            }"

      - name: Trigger build windows desktop
        if: inputs.release_tag != ''
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-windows-desktop.yml/dispatches \
            -d "{
              \"ref\": \"${{ github.ref_name }}\",
              \"inputs\": {
                \"release_tag\": \"${{ inputs.release_tag }}\"
              }
            }"
            
      - name: Trigger build windows x86
        if: inputs.release_tag != ''
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-windows-x86.yml/dispatches \
            -d "{
              \"ref\": \"${{ github.ref_name }}\",
              \"inputs\": {
                \"release_tag\": \"${{ inputs.release_tag }}\"
              }
            }"
